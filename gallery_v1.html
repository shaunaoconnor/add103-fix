<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery grid</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="gallery-container">
        <div class="main-display">
            <img src="thumb1.jpg" alt="Main Display" id="hero-image">
        </div>

        <div class="thumbnails-container">
            <div class="thumb">
                <img src="thumb1.jpg" alt="Thumbnail 1">
            </div>

            <div class="thumb">
                <img src="thumb2.jpg" alt="Thumbnail 2">
            </div>
            <div class="thumb">
                <img src="thumb3.jpg" alt="Thumbnail 3">
            </div>
            <div class="thumb">
                <img src="thumb4.jpg" alt="Thumbnail 4">
            </div>
            <div class="thumb">
                <img src="thumb5.jpg" alt="Thumbnail 5">
            </div>
        </div>
</body>

</html>
